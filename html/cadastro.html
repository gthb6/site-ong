<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Instituto Esperança</title>

    <link rel="stylesheet" href="../css/layout.css">

    <script>
        if (localStorage.getItem("temaInstituto") === "escuro") {
            document.documentElement.setAttribute("data-tema", "escuro");
        }
    </script>

</head>

<body>

    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <header>

        <h1>Instituto Esperança</h1>

        <button type="button" class="botao-tema" id="botao-tema" aria-label="Ativar modo escuro">
            🌙
        </button>

        <nav aria-label="Navegação principal">

            <button class="menu-hamburguer" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
                ☰
            </button>

            <div class="menu-links" id="menu-principal">
                <a href="index.html">Início</a>

                <a href="projetos.html">Projetos</a>

                <a href="cadastro.html" aria-current="page">Cadastro</a>
            </div>

        </nav>

    </header>

    <main id="conteudo">

        <h2>Cadastro de apoiador</h2>

        <form>

            <fieldset>

                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>

                <input type="text" id="nome" name="nome" autocomplete="name" required>

                <label for="email">E-mail:</label>

                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="cpf">CPF:</label>

                <input type="text" id="cpf" name="cpf" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" required>

                <label for="nascimento">Data de nascimento:</label>

                <input type="date" id="nascimento" name="nascimento" autocomplete="bday" required>

                <label for="telefone">Telefone:</label>

                <input type="tel" id="telefone" name="telefone" maxlength="15" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000" inputmode="tel" autocomplete="tel" required>

            </fieldset>

            <fieldset>

                <legend>Endereço</legend>

                <label for="cep">CEP:</label>

                <input type="text" id="cep" name="cep" maxlength="9" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" inputmode="numeric" autocomplete="postal-code" required>

                <label for="rua">Rua:</label>

                <input type="text" id="rua" name="rua" autocomplete="street-address" required>

                <label for="numero">Número:</label>

                <input type="number" id="numero" name="numero" min="1" autocomplete="address-line2" required>

                <label for="cidade">Cidade:</label>

                <input type="text" id="cidade" name="cidade" autocomplete="address-level2" required>

                <label for="estado">Estado:</label>

                <select id="estado" name="estado" autocomplete="address-level1" required>
                    <option value="">Selecione</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

            </fieldset>

            <fieldset>

                <legend>Como deseja participar?</legend>

                <label for="participacao">Forma de participação:</label>

                <select id="participacao" name="participacao" required>
                    <option value="">Selecione</option>
                    <option value="doacao">Fazer uma doação</option>
                    <option value="voluntario">Ser voluntário</option>
                    <option value="ambos">Doação e voluntariado</option>
                </select>

                <label for="mensagem">Mensagem:</label>

                <textarea id="mensagem" name="mensagem" rows="5"></textarea>

            </fieldset>

            <button type="submit">Enviar cadastro</button>

        </form>

    </main>

    <footer>

        <p>© 2026 Instituto Esperança - Todos os direitos reservados.</p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script vite-ignore src="../js/storage.js"></script>

    <script vite-ignore src="../js/templates.js"></script>

    <script vite-ignore src="../js/ui.js"></script>

    <script vite-ignore src="../js/form.js"></script>

    <script vite-ignore src="../js/app.js"></script>

</body>

</html>
